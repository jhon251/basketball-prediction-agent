[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-agent"
version = "0.1.0"
description = "Basketball Simulation & Prediction Agent V1 - statistical modeling + Monte Carlo sandbox system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    # pandas (+ a parquet engine: duckdb, or pyarrow) is only needed for the
    # Parquet ingest path (basketball_agent.data.collectors.nba_parquet).
    # numpy/scipy/scikit-learn are intentionally NOT declared: no source
    # module imports them (verified Phase 8-A).
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
basketball = "basketball_agent.cli.main:main"

[tool.setuptools.packages.find]
include = ["basketball_agent*"]

[tool.pytest.ini_options]
testpaths = ["basketball_agent/tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = [
    "unit: fast unit tests",
    "integration: tests crossing module boundaries",
    "regression: expected-output regression tests",
    "leakage: data-leakage detection tests",
    "simulation: simulation engine tests",
]
